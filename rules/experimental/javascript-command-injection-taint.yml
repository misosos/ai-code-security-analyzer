rules:
  - id: experimental.javascript-command-injection-taint
    languages: [javascript, typescript]
    mode: taint
    severity: ERROR
    message: A modeled request field may flow to a Node.js shell command string; review source reachability and execution context.
    metadata:
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
    pattern-sources:
      - pattern: req.query.cmd
      - pattern: req.body.cmd
    pattern-sinks:
      - patterns:
          - pattern: child_process.exec($CMD, ...)
          - focus-metavariable: $CMD
          - pattern-inside: |
              const child_process = require("child_process");
              ...
          - pattern-not-inside: |
              function $FUNCTION(...) {
                const child_process = $SHADOW;
                ...
              }
      - patterns:
          - pattern: child_process.execSync($CMD, ...)
          - focus-metavariable: $CMD
          - pattern-inside: |
              const child_process = require("child_process");
              ...
          - pattern-not-inside: |
              function $FUNCTION(...) {
                const child_process = $SHADOW;
                ...
              }
      - patterns:
          - pattern: child_process.exec($CMD, ...)
          - focus-metavariable: $CMD
          - pattern-inside: |
              const child_process = require("node:child_process");
              ...
          - pattern-not-inside: |
              function $FUNCTION(...) {
                const child_process = $SHADOW;
                ...
              }
      - patterns:
          - pattern: child_process.execSync($CMD, ...)
          - focus-metavariable: $CMD
          - pattern-inside: |
              const child_process = require("node:child_process");
              ...
          - pattern-not-inside: |
              function $FUNCTION(...) {
                const child_process = $SHADOW;
                ...
              }
      - patterns:
          - pattern: child_process.exec($CMD, ...)
          - focus-metavariable: $CMD
          - pattern-inside: |
              import * as child_process from "child_process";
              ...
      - patterns:
          - pattern: child_process.execSync($CMD, ...)
          - focus-metavariable: $CMD
          - pattern-inside: |
              import * as child_process from "child_process";
              ...
      - patterns:
          - pattern: child_process.exec($CMD, ...)
          - focus-metavariable: $CMD
          - pattern-inside: |
              import * as child_process from "node:child_process";
              ...
      - patterns:
          - pattern: child_process.execSync($CMD, ...)
          - focus-metavariable: $CMD
          - pattern-inside: |
              import * as child_process from "node:child_process";
              ...
      - patterns:
          - pattern: exec($CMD, ...)
          - focus-metavariable: $CMD
          - pattern-inside: |
              import { exec } from "node:child_process";
              ...
          - pattern-not-inside: |
              function $FUNCTION(...) {
                const exec = $SHADOW;
                ...
              }
      - patterns:
          - pattern: runCommand($CMD, ...)
          - focus-metavariable: $CMD
          - pattern-inside: |
              import { exec as runCommand } from "node:child_process";
              ...
          - pattern-not-inside: |
              function $FUNCTION(...) {
                const runCommand = $SHADOW;
                ...
              }
      - patterns:
          - pattern: execSync($CMD, ...)
          - focus-metavariable: $CMD
          - pattern-inside: |
              import { execSync } from "node:child_process";
              ...
          - pattern-not-inside: |
              function $FUNCTION(...) {
                const execSync = $SHADOW;
                ...
              }
      - patterns:
          - pattern: exec($CMD, ...)
          - focus-metavariable: $CMD
          - pattern-inside: |
              const { exec } = require("child_process");
              ...
          - pattern-not-inside: |
              function $FUNCTION(...) {
                const exec = $SHADOW;
                ...
              }
      - patterns:
          - pattern: runCommand($CMD, ...)
          - focus-metavariable: $CMD
          - pattern-inside: |
              const { exec: runCommand } = require("node:child_process");
              ...
          - pattern-not-inside: |
              function $FUNCTION(...) {
                const runCommand = $SHADOW;
                ...
              }
      - patterns:
          - pattern: execSync($CMD, ...)
          - focus-metavariable: $CMD
          - pattern-inside: |
              const { execSync } = require("child_process");
              ...
          - pattern-not-inside: |
              function $FUNCTION(...) {
                const execSync = $SHADOW;
                ...
              }
      - patterns:
          - pattern: require("child_process").exec($CMD, ...)
          - focus-metavariable: $CMD
      - patterns:
          - pattern: require("child_process").execSync($CMD, ...)
          - focus-metavariable: $CMD
      - patterns:
          - pattern: require("node:child_process").exec($CMD, ...)
          - focus-metavariable: $CMD
      - patterns:
          - pattern: require("node:child_process").execSync($CMD, ...)
          - focus-metavariable: $CMD
      - patterns:
          - pattern: 'spawn($COMMAND, [..., $ARG, ...], {..., shell: true, ...})'
          - focus-metavariable: $ARG
          - pattern-inside: |
              import { spawn } from "node:child_process";
              ...
          - pattern-not-inside: |
              function $FUNCTION(...) {
                const spawn = $SHADOW;
                ...
              }
      - patterns:
          - pattern: 'child_process.spawn($COMMAND, [..., $ARG, ...], {..., shell: true, ...})'
          - focus-metavariable: $ARG
          - pattern-inside: |
              const child_process = require("child_process");
              ...
          - pattern-not-inside: |
              function $FUNCTION(...) {
                const child_process = $SHADOW;
                ...
              }
      - patterns:
          - pattern: 'launch($COMMAND, {..., shell: true, ...})'
          - focus-metavariable: $COMMAND
          - pattern-inside: |
              import { spawn as launch } from "node:child_process";
              ...
          - pattern-not-inside: |
              function $FUNCTION(...) {
                const launch = $SHADOW;
                ...
              }

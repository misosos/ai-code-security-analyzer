rules:
  - id: experimental.javascript-command-injection-taint
    languages: [javascript, typescript]
    mode: taint
    severity: ERROR
    message: A modeled request field may flow to a Node.js shell command string; review source reachability and execution context.
    metadata:
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
    pattern-sources:
      - pattern: $REQ.query.cmd
      - pattern: $REQ.body.cmd
    pattern-sinks:
      - patterns:
          - pattern: child_process.exec($CMD, ...)
          - focus-metavariable: $CMD
          - pattern-inside: |
              const child_process = require("child_process");
              ...
      - patterns:
          - pattern: child_process.execSync($CMD, ...)
          - focus-metavariable: $CMD
          - pattern-inside: |
              const child_process = require("child_process");
              ...
      - patterns:
          - pattern: child_process.exec($CMD, ...)
          - focus-metavariable: $CMD
          - pattern-inside: |
              const child_process = require("node:child_process");
              ...
      - patterns:
          - pattern: child_process.execSync($CMD, ...)
          - focus-metavariable: $CMD
          - pattern-inside: |
              const child_process = require("node:child_process");
              ...
      - patterns:
          - pattern: child_process.exec($CMD, ...)
          - focus-metavariable: $CMD
          - pattern-inside: |
              import * as child_process from "child_process";
              ...
      - patterns:
          - pattern: child_process.execSync($CMD, ...)
          - focus-metavariable: $CMD
          - pattern-inside: |
              import * as child_process from "child_process";
              ...
      - patterns:
          - pattern: child_process.exec($CMD, ...)
          - focus-metavariable: $CMD
          - pattern-inside: |
              import * as child_process from "node:child_process";
              ...
      - patterns:
          - pattern: child_process.execSync($CMD, ...)
          - focus-metavariable: $CMD
          - pattern-inside: |
              import * as child_process from "node:child_process";
              ...
      - patterns:
          - pattern: require("child_process").exec($CMD, ...)
          - focus-metavariable: $CMD
      - patterns:
          - pattern: require("child_process").execSync($CMD, ...)
          - focus-metavariable: $CMD
      - patterns:
          - pattern: require("node:child_process").exec($CMD, ...)
          - focus-metavariable: $CMD
      - patterns:
          - pattern: require("node:child_process").execSync($CMD, ...)
          - focus-metavariable: $CMD

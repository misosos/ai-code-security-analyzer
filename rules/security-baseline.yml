rules:
  - id: baseline.javascript-dynamic-eval
    languages: [javascript, typescript]
    severity: ERROR
    message: Dynamic code evaluation requires review of input provenance and safer alternatives.
    metadata:
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"
    # R1-P: see docs/r1p-dynamic-eval-rule-integration.md for evidence and
    # known limitations (var/escaped-identifier shadowing, globalThis/window
    # member eval, Reflect.construct, closure-captured alias writes).
    options:
      # Follows single-assignment aliases such as `const run = eval; run(x)`;
      # a later reassignment (`run = other`) stops propagation.
      symbolic_propagation: true
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: ($X, eval)(...)
          - pattern: new Function(...)
          - pattern: Function(...)
      # A local binding named eval or Function shadows the global intrinsic.
      - pattern-not-inside: |
          function $F(..., eval, ...) { ... }
      - pattern-not-inside: |
          function $F(..., Function, ...) { ... }
      - pattern-not-inside: |
          function $F(...) { ... function eval(...) { ... } ... }
      - pattern-not-inside: |
          const eval = $V;
          ...
      - pattern-not-inside: |
          let eval = $V;
          ...

  - id: baseline.react-dangerous-html
    languages: [javascript, typescript]
    severity: WARNING
    message: Review HTML origin and sanitization before using dangerouslySetInnerHTML.
    metadata:
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation"
    pattern: '<$TAG ... dangerouslySetInnerHTML={{ __html: $HTML }} ... />'

  - id: baseline.firestore-unconditional-write
    languages: [regex]
    paths:
      include:
        - "**/firestore.rules"
    severity: ERROR
    message: A Firestore write permission has an unconditional true condition; review its match scope.
    metadata:
      cwe: "CWE-284: Improper Access Control"
    pattern-regex: '(?m)^[ \t]*allow[ \t]+(?:(?:read|get|list|write|create|update|delete)[ \t]*,[ \t]*)*(?:write|create|update|delete)(?:[ \t]*,[ \t]*(?:read|get|list|write|create|update|delete))*[ \t]*:[ \t]*if[ \t]+true[ \t]*;'

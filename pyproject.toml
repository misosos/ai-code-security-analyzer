[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-code-security-analyzer"
version = "0.1.0"
description = "A foundation for source code security findings"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.10,<3",
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-javascript>=0.23,<0.26",
    "tree-sitter-typescript>=0.23,<0.25",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

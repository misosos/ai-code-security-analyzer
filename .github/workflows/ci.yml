name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests and CLI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          uv-version: 0.11.26
          enable-cache: false

      - name: Check lockfile and install locked dependencies
        run: |
          uv lock --check
          uv sync --locked

      - name: Check CLI entry points
        run: |
          uv run --locked python -m ai_code_security_analyzer --help > /dev/null
          uv run --locked python -m ai_code_security_analyzer scan --help > /dev/null
          uv run --locked python -m ai_code_security_analyzer.api --help > /dev/null

      - name: Run Python regression suite
        run: uv run --locked python -m pytest -q -rs

  semgrep-integration:
    name: Semgrep 1.182.1 integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          uv-version: 0.11.26
          enable-cache: false

      - name: Check lockfile and install locked project dependencies
        run: |
          uv lock --check
          uv sync --locked

      - name: Install pinned Semgrep CLI
        run: |
          uv tool install --python 3.12 'semgrep==1.182.1'
          printf '%s\n' "$(uv tool dir --bin)" >> "$GITHUB_PATH"

      - name: Require the expected Semgrep version
        run: semgrep --version | grep -Fx '1.182.1'

      - name: Run real local-rule integration tests
        env:
          SEMGREP_REQUIRED: '1'
          SEMGREP_SEND_METRICS: 'off'
          SEMGREP_ENABLE_VERSION_CHECK: '0'
        run: >-
          uv run --locked python -m pytest -q -rs
          tests/test_semgrep_integration.py
          tests/test_scan_e2e.py
          tests/test_security_baseline.py
          tests/test_semgrep_taint_evaluation.py
          tests/test_command_injection_taint.py
          tests/test_command_injection_hardening.py
          tests/test_api_semgrep_e2e.py
          tests/test_firestore_context_validation.py
      - name: Run independent synthetic detection benchmark
        env:
          SEMGREP_REQUIRED: '1'
          SEMGREP_SEND_METRICS: 'off'
          SEMGREP_ENABLE_VERSION_CHECK: '0'
        run: >-
          uv run --locked python -m pytest -q -s
          tests/test_detection_benchmark_integration.py
          tests/test_firestore_rule_hardening.py
      - name: Run Phase 6D generalization evaluation
        env:
          SEMGREP_REQUIRED: '1'
          SEMGREP_SEND_METRICS: 'off'
          SEMGREP_ENABLE_VERSION_CHECK: '0'
        run: uv run --locked python -m pytest -q -s tests/test_phase6d_benchmark_integration.py
      - name: Run Phase 6E held-out evaluation
        env:
          SEMGREP_REQUIRED: '1'
          SEMGREP_SEND_METRICS: 'off'
          SEMGREP_ENABLE_VERSION_CHECK: '0'
        run: uv run --locked python -m pytest -q -s tests/test_phase6e_benchmark_integration.py

  frontend:
    name: React dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          uv-version: 0.11.26
          enable-cache: false

      - name: Install locked backend dependencies
        run: |
          uv lock --check
          uv sync --locked

      - name: Install pinned Semgrep CLI for real browser integration
        run: |
          uv tool install --python 3.12 'semgrep==1.182.1'
          printf '%s\n' "$(uv tool dir --bin)" >> "$GITHUB_PATH"

      - name: Require the expected Semgrep version
        run: semgrep --version | grep -Fx '1.182.1'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck, test, and build dashboard
        working-directory: frontend
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Install Chromium for browser smoke test
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke test
        working-directory: frontend
        run: npm run test:browser

      - name: Run required real Chromium, FastAPI, and Semgrep E2E
        working-directory: frontend
        env:
          SEMGREP_REQUIRED: '1'
          SEMGREP_SEND_METRICS: 'off'
          SEMGREP_ENABLE_VERSION_CHECK: '0'
        run: npm run test:e2e:real
